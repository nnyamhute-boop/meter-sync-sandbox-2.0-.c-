# Root Gradle properties for the monorepo.
# Android projects included via settings.gradle.kts (e.g. :products:revcoll:android-legacy:app)
# require these flags to be present here — Gradle does NOT pick up per-project gradle.properties
# when invoked against subproject tasks from the root wrapper.

# JVM memory for Gradle daemon and Kotlin compiler.
# Sized to fit the Microsoft-hosted ubuntu-latest agent (~7 GB RAM):
#   3 GB Gradle daemon + 2 GB Kotlin daemon = ~5 GB committed, leaving ~2 GB
#   headroom for R8/D8 native, AGP merges, OS, and apksigner. The previous
#   4 GB + 4 GB combination over-committed on a 7 GB box and triggered OOM
#   kills during release-variant R8 (CI build 4361 — agent abandoned mid
#   minify after lint+test daemon heap had already accumulated).
# If you need more headroom locally (>=16 GB RAM), override in
# ~/.gradle/gradle.properties — do not raise these caps here.
org.gradle.jvmargs=-Xmx3G -Dkotlin.daemon.jvm.options="-Xmx2G" -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2G

# AndroidX
android.useAndroidX=true
android.enableJetifier=true
android.nonFinalResIds=false
android.nonTransitiveRClass=false

# KSP
ksp.incremental=false
ksp.incremental.intermodule=false
